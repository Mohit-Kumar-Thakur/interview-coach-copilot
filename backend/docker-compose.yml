version: "3.8"
services:
  db:
    image: postgres:16
    container_name: interview_copilot_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot123
      POSTGRES_DB: interview_copilot
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
